<nav class="navbar navbar-light bg-light justify-content-between mt-3">
    <ul class="nav nav-pills">
        <li class="nav-item">
            <a class="nav-link" href="#" (click)="orderDate()">Orden por fecha</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#" (click)="orderPrice()">Orden por precio</a>
        </li>
    </ul>
    <form class="form-inline">
        <input class="form-control mr-sm-2" type="text" [(ngModel)]="search" name="search" placeholder="Search"
            aria-label="Search">
    </form>
</nav>
<div class="row">
    @if (events$ | async; as events){
        @for(event of events | eventFilter: search; track event.id){
        <div class="col-6 mt-4"> <!-- Repetir esto por cada evento -->
            <div class="card">
                <app-evento-item [event]="event" (deleteEmitter)="event.id ? deleteEvent(event.id) : null"></app-evento-item>
            </div>
        </div>

        }
    }
    
    @if(isEmptyEvents()){
        <h3>No hay eventos disponibles</h3>
    }

    <a id="link" routerLink="/eventos/add">+</a>
    
</div>
